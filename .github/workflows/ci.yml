name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build dev image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/backend.Dockerfile
          target: dev
          tags: probeloop-backend:dev
          load: true
          cache-from: type=gha,scope=backend-dev
          cache-to: type=gha,mode=max,scope=backend-dev

      - name: Lint and format
        run: |
          docker run --rm probeloop-backend:dev ruff check src tests evals
          docker run --rm probeloop-backend:dev ruff format --check src tests evals

      - name: Type check
        run: docker run --rm probeloop-backend:dev mypy

      - name: Import contracts
        run: docker run --rm probeloop-backend:dev lint-imports

      - name: Tests
        run: docker run --rm probeloop-backend:dev pytest -q

      - name: Documentation and installer contracts
        run: |
          docker run --rm -v "$PWD:/repo:ro" --entrypoint sh probeloop-backend:dev -c "python /repo/tools/check-docs.py && python /repo/tools/check-installer.py && sh -n /repo/installer/Start.sh"

      # The store and migration tests run again on PostgreSQL, so that SQLite-only constructs
      # cannot slip in (ADR 0004). A throwaway server without a password, on its own network.
      - name: Store tests on PostgreSQL
        run: |
          docker network create pg
          docker run -d --name pg --network pg -e POSTGRES_USER=probeloop             -e POSTGRES_DB=probeloop_test -e POSTGRES_HOST_AUTH_METHOD=trust postgres:17-alpine
          for i in $(seq 1 60); do
            if docker exec pg pg_isready -h 127.0.0.1 -U probeloop; then break; fi
            sleep 1
          done
          docker run --rm --network pg             -e PROBELOOP_TEST_DATABASE_URL=postgresql+asyncpg://probeloop@pg:5432/probeloop_test             probeloop-backend:dev pytest -q tests/storage -k postgresql

      # The frontend's TypeScript types are generated from the backend's API contract.
      - name: API contract and generated types are up to date
        run: |
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$PWD/frontend/src/shared/api/contract:/out" probeloop-backend:dev \
            python -m probeloop.api.contract /out
          docker run --rm -v "$PWD/frontend:/work" -w /work node:24.22.0-trixie-slim \
            sh -c "npm ci --no-audit --no-fund && npm run gen:types"
          git diff --exit-code -- frontend/src/shared/api

      - name: Build runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/backend.Dockerfile
          target: runtime
          tags: probeloop-backend:runtime
          load: true
          cache-from: type=gha,scope=backend-runtime
          cache-to: type=gha,mode=max,scope=backend-runtime

      - name: Runtime smoke test
        run: |
          docker run -d --name probeloop-smoke -p 127.0.0.1:8000:8000 --read-only --tmpfs /tmp \
            --tmpfs /data:uid=1000 probeloop-backend:runtime
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health; then exit 0; fi
            sleep 1
          done
          docker logs probeloop-smoke
          exit 1

      - name: Empty-volume provisioner and legacy ownership smoke
        run: |
          docker run -d --name probeloop-provisioner-smoke --read-only --tmpfs /tmp \
            --tmpfs /models:uid=0,gid=0,mode=755 --user 0:0 --cap-drop ALL \
            --cap-add CHOWN --cap-add SETUID --cap-add SETGID --entrypoint sh \
            probeloop-backend:runtime -c 'mkdir /models/piper; exec python -m probeloop.workspace.infrastructure.provisioner'
          trap 'docker logs probeloop-provisioner-smoke; docker rm -f probeloop-provisioner-smoke' EXIT
          for i in $(seq 1 60); do
            if docker exec probeloop-provisioner-smoke python -c 'import json,urllib.request; status=json.load(urllib.request.urlopen("http://127.0.0.1:8000/status", timeout=2)); assert status["available"] and len(status["models"])==4'; then
              docker exec --user 1000:1000 probeloop-provisioner-smoke python -c 'from pathlib import Path; Path("/models/piper/ownership-check").write_text("synthetic"); Path("/models/.installation/ownership-check").write_text("synthetic")'
              exit 0
            fi
            sleep 1
          done
          exit 1

      - name: Build stt-worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/stt-worker.Dockerfile
          target: cpu
          tags: probeloop-stt-worker:cpu
          load: true
          cache-from: type=gha,scope=stt-worker
          cache-to: type=gha,mode=max,scope=stt-worker

      # CI has no speech models: the worker must start, try to load them and report the failure
      # on /health instead of crashing.
      - name: stt-worker smoke test
        run: |
          docker run -d --name stt-smoke -p 127.0.0.1:8001:8000 --read-only --tmpfs /tmp \
            probeloop-stt-worker:cpu
          for i in $(seq 1 90); do
            status=$(curl -s http://127.0.0.1:8001/health | jq -r .status 2>/dev/null || true)
            if [ "$status" = "failed" ]; then exit 0; fi
            sleep 1
          done
          docker logs stt-smoke
          exit 1

      - name: Build tts-piper image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/tts-piper.Dockerfile
          tags: probeloop-tts-piper:ci
          load: true
          cache-from: type=gha,scope=tts-piper
          cache-to: type=gha,mode=max,scope=tts-piper

      # CI has no voices, and Piper's server refuses to start without one: check the install.
      - name: tts-piper smoke test
        run: docker run --rm --entrypoint python probeloop-tts-piper:ci -c "import piper.http_server"

  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Lint, format, type check, unit tests and build
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo/frontend node:24.22.0-trixie-slim sh -c \
            "npm ci --no-audit --no-fund && npm run lint && npm run lint:fsd && npm run format:check \
             && npm run typecheck && npm test && npm run build"

  # The whole browser path, with a scripted interviewer, fake speech engines and Chromium's fake
  # microphone playing a synthetic answer (compose.test.yaml, frontend/e2e).
  e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/backend.Dockerfile
          target: runtime
          tags: probeloop-backend:runtime
          load: true
          cache-from: type=gha,scope=backend-runtime

      - name: Start the backend with fake engines
        run: |
          docker compose -f compose.yaml -f compose.test.yaml up -d --no-deps backend
          for i in $(seq 1 60); do
            status=$(docker inspect -f '{{.State.Health.Status}}' probeloop-backend-1)
            if [ "$status" = "healthy" ]; then exit 0; fi
            sleep 1
          done
          docker compose logs backend
          exit 1

      - name: Playwright
        run: |
          docker run --rm --network container:probeloop-backend-1 -v "$PWD:/repo" \
            -w /repo/frontend -e CI=true mcr.microsoft.com/playwright:v1.65.0-noble \
            sh -c "npm ci --no-audit --no-fund && npx playwright test"

      - name: Backend logs
        if: failure()
        run: docker compose logs backend

      - name: Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan for secrets
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.28.0 git /repo --config /repo/.gitleaks.toml --redact --exit-code 1
