# Optional overlay for Linux hosts with an NVIDIA GPU and enough RAM: runs Ollama in Compose.
#   docker compose -f compose.yaml -f compose.nvidia.yaml up
services:
  ollama:
    image: ollama/ollama:0.40.14
    environment:
      OLLAMA_FLASH_ATTENTION: "1"
      OLLAMA_KV_CACHE_TYPE: q8_0
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
    volumes:
      - ollama:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  backend:
    environment:
      PROBELOOP_OLLAMA_BASE_URL: http://ollama:11434
    depends_on:
      - ollama

volumes:
  ollama:
    name: probeloop_ollama
