[project]
name = "probeloop"
version = "0.1.0"
description = "Self-hosted AI mock interview platform"
license = "Apache-2.0"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.162",
  "uvicorn[standard]>=0.54",
  "pydantic>=2.14",
  "pydantic-settings>=2.11",
  "ollama>=0.6.3",
  "jinja2>=3.1.6",
  "pyyaml>=6.0.3",
  "websockets>=15",
]

[project.scripts]
probeloop = "probeloop.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.4",
  "pytest-asyncio>=1.2",
  "httpx>=0.28",
  "mypy>=1.18",
  "ruff>=0.14",
  "import-linter>=2.5",
  "types-pyyaml>=6.0.12",
  "rapidfuzz>=3.14",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/probeloop"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests", "evals"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "S", "RUF", "SIM", "PT"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]
"evals/**" = ["S"]

[tool.mypy]
strict = true
python_version = "3.13"
mypy_path = "src"
packages = ["probeloop"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
markers = ["live: needs a running Ollama with real models; excluded from CI"]
addopts = "-m 'not live'"

[tool.importlinter]
root_package = "probeloop"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Interview domain is plain Python"
type = "forbidden"
source_modules = ["probeloop.interview.domain"]
forbidden_modules = [
  "fastapi",
  "starlette",
  "pydantic",
  "pydantic_core",
  "pydantic_settings",
  "ollama",
  "jinja2",
  "yaml",
  "probeloop.ai",
  "probeloop.storage",
  "probeloop.api",
  "probeloop.interview.application",
]
