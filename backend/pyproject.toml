[project]
name = "probeloop"
version = "0.1.0"
description = "Self-hosted AI mock interview platform"
license = "Apache-2.0"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi>=0.162",
  "uvicorn[standard]>=0.54",
  "pydantic>=2.14",
  "pydantic-settings>=2.11",
  "ollama>=0.6.3",
  "jinja2>=3.1.6",
  "pyyaml>=6.0.3",
  "websockets>=15",
  "pysilero-vad>=3.4",
  "httpx>=0.28",
  "numpy>=2.3",
  "onnxruntime>=1.24,<2",
  "tokenizers>=0.22,<1",
  "sqlalchemy[asyncio]>=2.0.44",
  "aiosqlite>=0.21",
  "asyncpg>=0.30",
  "alembic>=1.17",
  "python-multipart>=0.0.20",
  "pdfplumber>=0.11.7",
  "python-docx>=1.2",
  "rapidfuzz>=3.14",
  # Verifies the signature of ChatGPT sign-in ID tokens (ADR 0013).
  "cryptography>=50",
  "weasyprint>=70,<71",
]

[project.optional-dependencies]
# Speech recognition engines, installed only in the stt-worker image (and the dev image).
# faster-whisper 1.2.1 is incompatible with PyAV 17 and later (ADR 0009).
stt = [
  "onnx-asr[cpu,hub]>=0.12",
  "faster-whisper>=1.2.1",
  "av>=16,<17",
]

[project.scripts]
probeloop = "probeloop.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.4",
  "pytest-asyncio>=1.2",
  "httpx>=0.28",
  "mypy>=1.18",
  "ruff>=0.14",
  "import-linter>=2.5",
  "types-pyyaml>=6.0.12",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/probeloop"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests", "evals"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "S", "RUF", "SIM", "PT"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]
"evals/**" = ["S"]

[tool.mypy]
strict = true
python_version = "3.13"
mypy_path = "src"
packages = ["probeloop"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["faster_whisper", "faster_whisper.*", "onnxruntime", "onnxruntime.*", "weasyprint", "weasyprint.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
markers = ["live: needs real models (Ollama or speech engines); excluded from CI"]
addopts = "-m 'not live'"

[tool.importlinter]
root_package = "probeloop"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Installation use cases depend only on ports"
type = "forbidden"
source_modules = ["probeloop.workspace.installation"]
forbidden_modules = ["probeloop.workspace.infrastructure", "probeloop.bootstrap", "httpx", "fastapi", "pydantic", "ollama", "onnxruntime"]

[[tool.importlinter.contracts]]
name = "Interview domain is plain Python"
type = "forbidden"
source_modules = ["probeloop.interview.domain"]
forbidden_modules = [
  "fastapi",
  "starlette",
  "pydantic",
  "pydantic_core",
  "pydantic_settings",
  "ollama",
  "jinja2",
  "yaml",
  "sqlalchemy",
  "alembic",
  "probeloop.ai",
  "probeloop.speech",
  "probeloop.storage",
  "probeloop.api",
  "probeloop.interview.application",
  "probeloop.interview.infrastructure",
  "onnxruntime",
  "tokenizers",
]

[[tool.importlinter.contracts]]
name = "Speech does not depend on other modules"
type = "forbidden"
source_modules = ["probeloop.speech"]
forbidden_modules = [
  "probeloop.interview",
  "probeloop.ai",
  "probeloop.storage",
  "probeloop.api",
  "probeloop.bootstrap",
]

[[tool.importlinter.contracts]]
name = "Speech use cases do not import adapters"
type = "forbidden"
source_modules = [
  "probeloop.speech.ports",
  "probeloop.speech.audio",
  "probeloop.speech.segmenter",
  "probeloop.speech.filters",
  "probeloop.speech.transcriber",
  "probeloop.speech.sentences",
  "probeloop.speech.synthesizer",
]
forbidden_modules = [
  "probeloop.speech.silero",
  "probeloop.speech.parakeet",
  "probeloop.speech.whisper",
  "probeloop.speech.http_stt",
  "probeloop.speech.piper",
  "probeloop.speech.worker",
  "probeloop.speech.fake",
  "pysilero_vad",
  "numpy",
  "onnx_asr",
  "onnxruntime",
  "faster_whisper",
  "fastapi",
  "starlette",
  "pydantic",
  "httpx",
]

[[tool.importlinter.contracts]]
name = "Interview use cases do not import adapters"
type = "forbidden"
source_modules = ["probeloop.interview.application"]
forbidden_modules = [
  "probeloop.interview.infrastructure",
  "onnxruntime",
  "tokenizers",
  "probeloop.storage",
  "probeloop.api",
  "probeloop.bootstrap",
  "sqlalchemy",
  "alembic",
  "fastapi",
  "starlette",
]

[[tool.importlinter.contracts]]
name = "Platform services do not depend on business modules"
type = "forbidden"
source_modules = ["probeloop.platform"]
forbidden_modules = [
  "probeloop.interview",
  "probeloop.speech",
  "probeloop.ai",
  "probeloop.storage",
  "probeloop.api",
  "probeloop.bootstrap",
  "sqlalchemy",
  "fastapi",
]

[[tool.importlinter.contracts]]
name = "Context domain is plain Python"
type = "forbidden"
source_modules = ["probeloop.context.domain"]
forbidden_modules = [
  "pydantic",
  "sqlalchemy",
  "fastapi",
  "probeloop.ai",
  "probeloop.context.application",
  "probeloop.context.infrastructure",
  "probeloop.storage",
  "probeloop.api",
]

[[tool.importlinter.contracts]]
name = "Context depends on neither the interview nor the adapters"
type = "forbidden"
source_modules = ["probeloop.context.domain", "probeloop.context.application"]
forbidden_modules = [
  "probeloop.interview",
  "probeloop.context.infrastructure",
  "probeloop.storage",
  "probeloop.api",
  "probeloop.bootstrap",
  "sqlalchemy",
  "fastapi",
  "pdfplumber",
  "docx",
  "probeloop.assessment",
]

[[tool.importlinter.contracts]]
name = "Assessment domain is plain Python"
type = "forbidden"
source_modules = ["probeloop.assessment.domain"]
forbidden_modules = [
  "pydantic", "sqlalchemy", "fastapi", "ollama", "jinja2", "yaml",
  "probeloop.ai", "probeloop.speech", "probeloop.storage", "probeloop.api",
  "probeloop.assessment.application", "probeloop.assessment.infrastructure",
]

[[tool.importlinter.contracts]]
name = "Assessment use cases do not import adapters"
type = "forbidden"
source_modules = ["probeloop.assessment.application"]
forbidden_modules = [
  "probeloop.storage", "probeloop.api", "probeloop.bootstrap",
  "probeloop.assessment.infrastructure", "sqlalchemy", "fastapi",
]
