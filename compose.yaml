# ProbeLoop runtime. On Windows/macOS the LLM is the Ollama installed on the host
# (see docs/research/spike-results.md); on Linux, add compose.nvidia.yaml to run it here.
#
# Only the backend is published, on 127.0.0.1. The speech services sit on the `internal`
# network, which has no route outside Compose: their models are downloaded beforehand with
#   docker compose --profile setup run --rm stt-models
#   docker compose --profile setup run --rm tts-voices
name: probeloop

x-hardening: &hardening
  read_only: true
  tmpfs:
    - /tmp
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true

services:
  backend:
    <<: *hardening
    image: probeloop-backend:runtime
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      target: runtime
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      PROBELOOP_OLLAMA_BASE_URL: ${PROBELOOP_OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      PROBELOOP_INTERVIEWER_MODEL: ${PROBELOOP_INTERVIEWER_MODEL:-ministral-3:8b}
      PROBELOOP_INTERVIEWER_TURN: ${PROBELOOP_INTERVIEWER_TURN:-two_step}
      PROBELOOP_LLM_DEBUG_LOG: ${PROBELOOP_LLM_DEBUG_LOG:-false}
      PROBELOOP_DATA_DIR: /data
      # Empty: SQLite in the data volume. With the `postgres` profile, for example
      # postgresql+asyncpg://probeloop:<password>@postgres:5432/probeloop
      PROBELOOP_DATABASE_URL: ${PROBELOOP_DATABASE_URL:-}
      PROBELOOP_STT_URL: http://stt-worker:8000
      PROBELOOP_TTS_URL: http://tts-piper:5000
      PROBELOOP_TTS_VOICE_IT: ${PROBELOOP_TTS_VOICE:-it_IT-serena-medium}
      # Cloud execution profile (docs/adr/0013-cloud-execution-profile.md): after Sign in with
      # ChatGPT in Settings, the interviewer, analysis and evaluation use these models through
      # the user's ChatGPT plan.
      PROBELOOP_CLOUD_INTERVIEWER_MODEL: ${PROBELOOP_CLOUD_INTERVIEWER_MODEL:-gpt-6.1-terra}
      PROBELOOP_CLOUD_ANALYSIS_MODEL: ${PROBELOOP_CLOUD_ANALYSIS_MODEL:-gpt-6.1-terra}
      PROBELOOP_CLOUD_EVALUATION_MODEL: ${PROBELOOP_CLOUD_EVALUATION_MODEL:-gpt-6.1-terra}
      # "none", "low" for models without "none", or empty for models without reasoning control.
      PROBELOOP_CLOUD_REASONING_OFF: ${PROBELOOP_CLOUD_REASONING_OFF-none}
    volumes:
      - data:/data
    networks: [default, internal]
    extra_hosts:
      - host.docker.internal:host-gateway
    restart: unless-stopped

  stt-worker:
    <<: *hardening
    image: probeloop-stt-worker:cpu
    build: &stt-build
      context: .
      dockerfile: docker/stt-worker.Dockerfile
      target: cpu
    environment:
      PROBELOOP_STT_THREADS: ${PROBELOOP_STT_THREADS:-6}
      PROBELOOP_STT_PRELOAD_REFINE: ${PROBELOOP_STT_PRELOAD_REFINE:-false}
    volumes:
      - models:/models:ro
    networks: [internal]
    cpus: ${PROBELOOP_STT_CPUS:-6}
    restart: unless-stopped

  tts-piper:
    <<: *hardening
    image: probeloop-tts-piper:1.8.0
    build: &tts-build
      context: .
      dockerfile: docker/tts-piper.Dockerfile
    command: ["-m", "${PROBELOOP_TTS_VOICE:-it_IT-serena-medium}"]
    volumes:
      - models:/models:ro
    networks: [internal]
    restart: unless-stopped

  # One-shot: downloads the speech recognition models into the `models` volume.
  stt-models:
    <<: *hardening
    image: probeloop-stt-worker:cpu
    build: *stt-build
    profiles: [setup]
    command: ["python", "-m", "probeloop.speech.worker", "download"]
    environment:
      HF_HUB_OFFLINE: "0"
    volumes:
      - models:/models

  # One-shot: downloads Piper voices into the `models` volume. Pass other voice names to add them.
  tts-voices:
    <<: *hardening
    image: probeloop-tts-piper:1.8.0
    build: *tts-build
    profiles: [setup]
    entrypoint: ["python", "-m", "piper.download_voices", "--data-dir", "/models/piper"]
    command: ["${PROBELOOP_TTS_VOICE:-it_IT-serena-medium}"]
    volumes:
      - models:/models

  # Development tool: a synthetic candidate that answers out loud (backend/evals/voice_candidate.py).
  # It shares the backend's network, so it reaches the backend on 127.0.0.1 and Piper by name.
  #   docker compose --profile tools run --rm voice-candidate --minutes 10
  # Runs are written to ./var/voice-candidate (git-ignored).
  voice-candidate:
    image: probeloop-backend:dev
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      target: dev
    profiles: [tools]
    network_mode: service:backend
    entrypoint: ["python", "-m", "evals.voice_candidate"]
    volumes:
      - ./var/voice-candidate:/io

  # Optional PostgreSQL instead of SQLite:
  #   PROBELOOP_POSTGRES_PASSWORD=... PROBELOOP_DATABASE_URL=postgresql+asyncpg://probeloop:...@postgres:5432/probeloop   #     docker compose --profile postgres up -d
  # Sessions are not copied between the two databases.
  postgres:
    image: postgres:17-alpine
    profiles: [postgres]
    environment:
      POSTGRES_USER: probeloop
      POSTGRES_DB: probeloop
      POSTGRES_PASSWORD: ${PROBELOOP_POSTGRES_PASSWORD:-}  # the server refuses to start without one
    volumes:
      - postgres:/var/lib/postgresql/data
    networks: [internal]
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

networks:
  internal:
    internal: true

volumes:
  data:
    name: probeloop_data
  models:
    name: probeloop_models
  postgres:
    name: probeloop_postgres
